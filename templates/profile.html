{% extends 'base.html' %}{% block content %}<section class="narrow"><p class="eyebrow">PROFILE & SETTINGS</p><h1>Your preferences.</h1><form class="paper-card form" method="post"><label>Name<input name="name" value="{{user.name}}"></label><label>Email<input value="{{user.email}}" disabled></label><label>Preferred currency<select name="currency">{% for c in ['INR','USD','EUR','GBP'] %}<option {% if user.currency==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><button class="primary">Save changes</button></form></section>{% endblock %}

{% extends 'base.html' %}{% block content %}<section class="narrow"><p class="eyebrow">CREATE A TRIP</p><h1>Tell us the basics.</h1><form class="paper-card form" method="post"><label>Destination<input name="destination" value="{{destination}}" required></label><div class="two"><label>Days<input type="number" name="days" value="4" min="1"></label><label>Travelers<input type="number" name="travelers" value="2" min="1"></label></div><label>Budget (₹)<input type="number" name="budget" value="50000"></label><label>Travel style<select name="style"><option>Budget</option><option selected>Mid-Range</option><option>Luxury</option></select></label><label>Accommodation<select name="hotel">{% for h in d.hotels %}<option>{{h[0]}}</option>{% endfor %}</select></label><button class="primary">Generate trip plan →</button></form></section>{% endblock %}
